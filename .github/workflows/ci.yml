name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - name: Install WASM bindings CLI
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Test and lint production runtime bindings
        run: |
          cargo test --locked --manifest-path tests/runtime/Cargo.toml --target-dir target --lib
          cargo fmt --manifest-path tests/runtime/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tests/runtime/Cargo.toml --target-dir target --all-targets -- -D warnings
      - name: Verify independent AES fixtures
        run: python3 scripts/verify_crypto.py --openssl
      - name: Compare native, actual Node WASM and real Chrome
        run: python3 scripts/verify_runtime.py --browser
      - name: Lint the WASM host adapter
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --example keyed_wasm -- -D warnings
      - name: Verify packaged docs and WASM example
        run: python3 scripts/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-contract-evidence
          path: target/runtime/*-evidence.json

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Test serde checkpoints
        run: cargo test --features serde

      - name: Test without default source
        run: cargo test --no-default-features

      - name: Test serde without default source
        run: cargo test --no-default-features --features serde

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --features serde -- -D warnings

      - name: Check wasm32 compilation
        run: cargo check --target wasm32-unknown-unknown --no-default-features

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute WASM session contracts
        run: |
          cargo build --target wasm32-unknown-unknown --no-default-features --example wasm_session
          node scripts/test_wasm_session.mjs

  ffmpeg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg libraries
        run: brew install ffmpeg pkg-config
      - name: Test FFmpeg backend
        run: cargo test --all-features
      - name: Clippy with FFmpeg backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify retained media corpus with FFprobe and FFmpeg
        run: python3 -u scripts/verify_media.py

      - name: Verify dual-input packets and both finalize backends
        run: python3 -u scripts/verify_multi_input.py --ffmpeg

      - name: Verify AES resource corpus independently
        run: python3 scripts/verify_crypto.py --openssl --ffmpeg

      - name: Verify keyed prepared output packets and decodes
        run: python3 scripts/verify_keyed.py --ffmpeg

      - name: Verify keyed B-frame tails against independent clear decodes
        run: python3 -u scripts/verify_keyed_decode.py

      - name: Verify fragmented duration with offset external audio
        run: python3 -u scripts/verify_fragmented_timeline.py

      - name: Verify native keyed SDK example
        run: python3 scripts/verify_keyed_examples.py
