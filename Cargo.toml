[package]
name = "hls-transmux"
version = "0.6.0"
edition = "2024"
description = "A small, dependency-light HLS → MP4 transmuxer for Rust (TS/fMP4 in, MP4/CMAF out)."
license = "MIT"
repository = "https://github.com/Logosww/hls-transmux"
homepage = "https://github.com/Logosww/hls-transmux"
readme = "README.md"
keywords = ["hls", "mp4", "transmux", "cmaf", "isobmff"]
categories = ["multimedia::video", "multimedia"]
# Public guides are required by include_str! even when a workspace ignores docs.
# Keep planning, the nested runtime test crate and generated artifacts outside the archive.
include = ["/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/.gitattributes", "/.github/**", "/src/**", "/tests/**", "/examples/*.rs", "/scripts/*.py", "/scripts/*.mjs", "/docs/*.md", "/docs/*.json"]

[features]
default = ["default-source"]
# Built-in reqwest-backed `Source` implementation. Enabled by default. Disable
# with `default-features = false` to drop the reqwest dependency entirely and
# plug in your own `Source` implementation via `HlsInput::custom`.
default-source = ["dep:reqwest"]
# Use ffmpeg (via ffmpeg-next) for `StreamingMp4` finalization instead of the
# crate's self-contained ISOBMFF demux + MP4 mux defrag path. Off by default.
# Requires the FFmpeg 9 shared libraries (libavformat/libavcodec/libavutil) and
# pkg-config at build time. Selected at runtime via
# `TransmuxOptions::finalize_backend = FinalizeBackend::Ffmpeg`.
ffmpeg-finalize = ["dep:ffmpeg-next"]
# Enable lossless typed playlist archives and `TransmuxResumeState` serde.
# Callers can
# persist the resume checkpoint directly via e.g. `serde_json`. Off by default;
# callers may also serialize the versioned checkpoint fields without this feature.
serde = ["dep:serde"]

[dependencies]
aes = { version = "=0.8.4", features = ["zeroize"] }
cbc = { version = "=0.1.2", default-features = false, features = ["block-padding", "zeroize"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
zeroize = "1.9"
sha2 = "0.10"
ffmpeg-next = { version = "9.0", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# Base tokio for all targets: only features that work on wasm32.
# Native-only features (fs, net, rt-multi-thread) are added via
# target-specific dependencies below.
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "sync", "rt", "time"] }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
serde_json = "1"

[[example]]
name = "wasm_session"
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"

[[example]]
name = "keyed_wasm"
crate-type = ["cdylib"]
